<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NACOR Skills Station Rehearsal</title>
<style>
  :root { --primary: #1B3A6B; --secondary: #0A7E8C; --warn: #B3261E;
           --ink: #1F2937; --muted: #6B7280; --line: #E5E7EB; --bg: #F7F8FA; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif; background: var(--bg);
          color: var(--ink); line-height: 1.5; }
  header { background: var(--primary); color: #fff; padding: 18px 20px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 6px 0 0; opacity: .9; font-size: 14px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px;
           padding: 18px; margin-bottom: 14px; }
  .gate input { font-size: 18px; padding: 10px; width: 220px; letter-spacing: 2px;
                 text-transform: uppercase; border: 2px solid var(--line);
                 border-radius: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: none;
            padding: 11px 18px; background: var(--primary); color: #fff; }
  button.ghost { background: #fff; color: var(--primary);
                  border: 2px solid var(--primary); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .st-item { display: flex; justify-content: space-between; align-items: center;
              gap: 12px; border: 1px solid var(--line); border-radius: 10px;
              padding: 12px 14px; margin-bottom: 10px; background: #fff; }
  .st-item h3 { margin: 0 0 4px; font-size: 16px; }
  .st-meta { font-size: 13px; color: var(--muted); }
  .pill { display: inline-block; background: #EEF3FF; color: var(--primary);
           border-radius: 999px; padding: 2px 10px; font-size: 12px;
           font-weight: 700; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 22px;
            color: var(--primary); }
  .timer.low { color: var(--warn); }
  .step { border: 2px solid var(--line); border-radius: 10px; padding: 11px 14px;
           margin-bottom: 9px; background: #fff; cursor: pointer;
           display: flex; gap: 10px; align-items: flex-start; }
  .step:hover { border-color: var(--secondary); }
  .step .num { min-width: 26px; height: 26px; border-radius: 50%;
                background: var(--primary); color: #fff; font-size: 13px;
                font-weight: 700; display: flex; align-items: center;
                justify-content: center; }
  .step.placed { background: #F3F4F6; color: var(--muted); cursor: default;
                  border-style: dashed; }
  .step.right { border-color: #1A6B3A; background: #EEFFF3; }
  .step.wrong { border-color: var(--warn); background: #FEF1F0; }
  .crit { color: var(--warn); font-weight: 700; font-size: 12px; }
  .score { font-size: 15px; }
  .bar { height: 10px; background: var(--line); border-radius: 999px;
          overflow: hidden; margin: 8px 0 2px; }
  .bar > i { display: block; height: 100%; background: var(--secondary); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .note { font-size: 13px; color: var(--muted); }
  a.back { color: #fff; text-decoration: none; font-size: 14px; opacity: .9; }
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-top:0;padding-bottom:0">
    <a class="back" href="./">Back to the exam simulator</a>
    <h1>NACOR Skills Station Rehearsal</h1>
    <p>Optical Sciences 1, Eyeglasses. Rehearse the order of every hands-on step
       under the real section clock.</p>
  </div>
</header>
<div class="wrap" id="app"></div>

const ACCESS_CODE = "NACOR9000";
const KEY = "nacor_skills_state_v1";
let timerId = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}
function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
function unlocked() {
  try { return localStorage.getItem(KEY) === "ok"; } catch (e) { return false; }
}

function renderGate() {
  document.getElementById("app").innerHTML = `
    <div class="card gate">
      <h2 style="margin-top:0">Enter your access code</h2>
      <p class="note">The code is printed in your study guide.</p>
      <div class="row">
        <input id="code" placeholder="CODE" autocomplete="off">
        <button id="go">Unlock</button>
      </div>
      <p id="err" style="color:var(--warn);display:none;margin-bottom:0">
        That code is not correct.</p>
    </div>`;
  const tryCode = () => {
    const v = document.getElementById("code").value.trim().toUpperCase();
    if (v === ACCESS_CODE) {
      try { localStorage.setItem(KEY, "ok"); } catch (e) {}
      renderList();
    } else {
      document.getElementById("err").style.display = "block";
    }
  };
  document.getElementById("go").onclick = tryCode;
  document.getElementById("code").addEventListener("keydown",
    e => { if (e.key === "Enter") tryCode(); });
}

function renderList() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  const bySec = {};
  STATIONS.forEach(s => { (bySec[s.section] = bySec[s.section] || []).push(s); });
  let h = `<div class="card">
    <h2 style="margin-top:0">Choose a station</h2>
    <p class="note">Each station gives you the real steps in scrambled order.
    Tap them into the correct sequence. Steps marked critical are the ones that
    cost the most marks or create a real safety or equipment problem.</p></div>`;
  Object.keys(bySec).forEach(sec => {
    h += `<div class="card"><h3 style="margin-top:0">${esc(sec)}</h3>`;
    bySec[sec].forEach(s => {
      h += `<div class="st-item">
        <div>
          <h3>${esc(s.title)}</h3>
          <div class="st-meta">${s.steps.length} steps
            &nbsp;<span class="pill">${s.station_time_min} min</span></div>
        </div>
        <button data-id="${s.id}">Start</button>
      </div>`;
    });
    h += `</div>`;
  });
  document.getElementById("app").innerHTML = h;
  document.querySelectorAll("button[data-id]").forEach(b => {
    b.onclick = () => renderStation(b.getAttribute("data-id"));
  });
}

function renderStation(id) {
  const st = STATIONS.find(s => s.id === id);
  const pool = shuffle(st.steps.map((s, i) => ({ ...s, idx: i })));
  const placed = [];
  let left = st.station_time_min * 60;

  function paint() {
    const m = Math.floor(left / 60), sec = left % 60;
    const done = placed.length, total = st.steps.length;
    let h = `<div class="card">
      <div class="row" style="justify-content:space-between">
        <div><span class="pill">${esc(st.section)}</span>
          <h2 style="margin:8px 0 0">${esc(st.title)}</h2></div>
        <div class="timer${left <= 30 ? " low" : ""}" id="tm">
          ${m}:${String(sec).padStart(2, "0")}</div>
      </div>
      <p class="note" style="margin-bottom:6px">${esc(st.context)}</p>
      <div class="bar"><i style="width:${Math.round(100 * done / total)}%"></i></div>
      <div class="note">${done} of ${total} steps placed</div>
    </div>`;

    h += `<div class="card"><h3 style="margin-top:0">Your sequence</h3>`;
    if (!placed.length) h += `<p class="note">Tap a step below to begin.</p>`;
    placed.forEach((s, i) => {
      h += `<div class="step placed"><div class="num">${i + 1}</div>
        <div>${esc(s.text)}</div></div>`;
    });
    h += `</div>`;

    const rest = pool.filter(p => !placed.some(q => q.idx === p.idx));
    if (rest.length) {
      h += `<div class="card"><h3 style="margin-top:0">Remaining steps</h3>`;
      rest.forEach(s => {
        h += `<div class="step" data-i="${s.idx}"><div class="num">+</div>
          <div>${esc(s.text)}</div></div>`;
      });
      h += `</div>`;
    }
    h += `<div class="card row">
      <button id="check" ${rest.length ? "disabled" : ""}>Check my sequence</button>
      <button class="ghost" id="reset">Start over</button>
      <button class="ghost" id="back">All stations</button>
      ${rest.length ? '<span class="note">Place every step to check.</span>' : ""}
    </div>`;
    document.getElementById("app").innerHTML = h;

    document.querySelectorAll(".step[data-i]").forEach(el => {
      el.onclick = () => {
        placed.push(pool.find(p => p.idx === +el.getAttribute("data-i")));
        paint();
      };
    });
    document.getElementById("reset").onclick = () => renderStation(id);
    document.getElementById("back").onclick = renderList;
    const c = document.getElementById("check");
    if (c) c.onclick = grade;
  }

  function grade() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    let correct = 0, critMissed = 0;
    placed.forEach((s, i) => {
      if (s.idx === i) correct++;
      else if (s.critical) critMissed++;
    });
    const pct = Math.round(100 * correct / st.steps.length);
    let h = `<div class="card">
      <h2 style="margin-top:0">${esc(st.title)}</h2>
      <p class="score"><strong>${correct} of ${st.steps.length}</strong>
         steps in the right position (${pct} percent).</p>`;
    if (critMissed) {
      h += `<p class="crit">${critMissed} critical step${critMissed > 1 ? "s" : ""}
            out of position. On the real exam those are where the marks go.</p>`;
    } else {
      h += `<p class="note">Every critical step was in the right place.</p>`;
    }
    h += `</div><div class="card"><h3 style="margin-top:0">The correct order</h3>`;
    st.steps.forEach((s, i) => {
      const yours = placed[i];
      const ok = yours && yours.idx === i;
      h += `<div class="step ${ok ? "right" : "wrong"}">
        <div class="num">${i + 1}</div>
        <div>${esc(s.text)}
          ${s.critical ? '<div class="crit">critical step</div>' : ""}
          ${ok ? "" : `<div class="note">you placed: ${
             yours ? esc(yours.text) : "nothing"}</div>`}
        </div></div>`;
    });
    h += `</div><div class="card row">
      <button id="again">Try this station again</button>
      <button class="ghost" id="back2">All stations</button></div>`;
    document.getElementById("app").innerHTML = h;
    document.getElementById("again").onclick = () => renderStation(id);
    document.getElementById("back2").onclick = renderList;
  }

  paint();
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => {
    left--;
    const t = document.getElementById("tm");
    if (t) {
      const m = Math.floor(Math.max(0, left) / 60), s = Math.max(0, left) % 60;
      t.textContent = `${m}:${String(s).padStart(2, "0")}`;
      if (left <= 30) t.classList.add("low");
    }
    if (left <= 0) { clearInterval(timerId); timerId = null; grade(); }
  }, 1000);
}

if (unlocked()) renderList(); else renderGate();
</script>
</body>
</html>
